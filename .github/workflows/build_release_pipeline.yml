name: APK Build and Release Pipeline

env:
  main_project_module: app
  app_name: JTV-GO-Server

on:
  push:
    branches:
      - main
    paths:
      - "app/version.gradle"

  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - dev

      dev_suffix:
        description: "Dev suffix (example: dev.1)"
        required: false
        default: "dev.1"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Repository name
      # ---------------------------------------------------------
      - name: Set repository name
        run: |
          echo "repository_name=$(basename "${{ github.repository }}")" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # Build date
      # ---------------------------------------------------------
      - name: Set build date
        run: |
          echo "date_today=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # Extract version from version.gradle
      # ---------------------------------------------------------
      - name: Extract version information
        run: |
          version_code=$(grep appVersionCode app/version.gradle | awk -F'=' '{print $2}' | tr -d ' "')
          version_name=$(grep appVersionName app/version.gradle | awk -F'=' '{print $2}' | tr -d ' "')

          echo "version_code=$version_code" >> "$GITHUB_ENV"
          echo "version_name=$version_name" >> "$GITHUB_ENV"

          echo "Version Code: $version_code"
          echo "Version Name: $version_name"

      # ---------------------------------------------------------
      # Determine release type
      # ---------------------------------------------------------
      - name: Determine release type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_type="${{ inputs.release_type }}"
          else
            release_type="release"
          fi

          echo "release_type=$release_type" >> "$GITHUB_ENV"

          if [ "$release_type" = "dev" ]; then
            dev_suffix="${{ inputs.dev_suffix }}"

            if [ -z "$dev_suffix" ]; then
              dev_suffix="dev.1"
            fi

            release_version="${version_name}-${dev_suffix}"
            prerelease="true"
          else
            release_version="${version_name}"
            prerelease="false"
          fi

          echo "release_version=$release_version" >> "$GITHUB_ENV"
          echo "prerelease=$prerelease" >> "$GITHUB_ENV"

          echo "Release type: $release_type"
          echo "Release version: $release_version"
          echo "Prerelease: $prerelease"

      # ---------------------------------------------------------
      # Set up JDK
      # ---------------------------------------------------------
      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "18"
          cache: gradle

      # ---------------------------------------------------------
      # Gradle permissions
      # ---------------------------------------------------------
      - name: Change permissions for gradlew
        run: chmod +x ./gradlew

      # ---------------------------------------------------------
      # Build APK
      # ---------------------------------------------------------
      - name: Build release APK
        run: ./gradlew :${{ env.main_project_module }}:assembleRelease

      # ---------------------------------------------------------
      # Sign APK
      # ---------------------------------------------------------
      - name: Sign APK release
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: ${{ env.main_project_module }}/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          # signingKeyBase64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          # alias: "release"
          # keyStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          # keyPassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      # ---------------------------------------------------------
      # Rename APK
      # ---------------------------------------------------------
      - name: Rename APK
        run: |
          mv \
            ${{ env.main_project_module }}/build/outputs/apk/release/app-release-unsigned-signed.apk \
            ${{ env.main_project_module }}/build/outputs/apk/release/${{ env.app_name }}-v${{ env.release_version }}-release.apk

      # ---------------------------------------------------------
      # Create GitHub Release
      # ---------------------------------------------------------
      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.release_version }}"
          name: "v${{ env.release_version }}"
          files: |
            ${{ env.main_project_module }}/build/outputs/apk/release/${{ env.app_name }}-v${{ env.release_version }}-release.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ env.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
